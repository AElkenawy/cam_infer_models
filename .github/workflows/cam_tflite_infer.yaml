name: "cam_tflite_infer"

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:
    

jobs:
  infer_models:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          persist-credentials: false
      
      - name: Install runtime packages
        run: |
          # Add LLVM repository for clang-18 with full AVX-VNNI support
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
          
          sudo apt-get -o DPkg::Lock::Timeout=1200 -y update
          sudo apt-get -o DPkg::Lock::Timeout=1200 -y install \
            \
            cmake g++ git unzip wget \
            clang-18 \
            \
            libusb-1.0-0 libgtk-3-dev libtbb-dev \
            $([[ "${{ matrix.os }}" == "ubuntu-20.04" ]] && echo "libtbb2") \
            $([[ "${{ matrix.os }}" == "ubuntu-22.04" ]] && echo "libtbbmalloc2")

          sudo apt-get -o DPkg::Lock::Timeout=1200 -y install \
            build-essential autoconf libtool pkg-config zlib1g-dev \
            \
            meson ninja-build \
            \
            python3 python3-pip python3-numpy \
            openjdk-11-jdk
          
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
            
          cmake --version
          gcc --version
          clang --version
          java -version

      - name: Cache opencv
        id: cache-opencv
        uses: actions/cache@v4
        with:
          key: ${{
            matrix.os == 'ubuntu-20.04' && 'opencv-ubuntu20' ||
            matrix.os == 'ubuntu-22.04' && 'opencv-ubuntu22' }}
          path: |
            ${{ github.workspace }}/build/staging

      - name: Build opencv
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        working-directory: ${{github.workspace}}
        run: |
          git clone https://github.com/opencv/opencv.git opencv_${{ matrix.os }}
          git clone https://github.com/opencv/opencv_contrib.git opencv_contrib_${{ matrix.os }}
          git -C opencv_${{ matrix.os }} checkout tags/4.12.0
          git -C opencv_contrib_${{ matrix.os }} checkout tags/4.12.0
          mkdir -p ${{ github.workspace }}/build/opencv_${{ matrix.os }}
          CC=/usr/bin/clang CXX=/usr/bin/clang++ \
          cmake \
            -S ${{ github.workspace }}/opencv_${{ matrix.os }} \
            -B ${{ github.workspace }}/build/opencv_${{ matrix.os }} \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_STAGING_PREFIX=${{ github.workspace }}/build/staging \
            -D BUILD_NUMBER=${GITHUB_RUN_ID} \
            -D CMAKE_VERBOSE_MAKEFILE=ON \
            -D OPENCV_GENERATE_PKGCONFIG=ON \
            \
            -D BUILD_opencv_gapi=OFF \
            -D BUILD_opencv_gapi_samples=OFF \
            -D BUILD_EXAMPLES=ON
          cmake --build ${{ github.workspace }}/build/opencv_${{ matrix.os }} -- -j4

          
      - name: Cache pipewire
        id: cache-pipewire
        uses: actions/cache@v4
        with:
          key: pipewire
          path: |
            ${{ github.workspace }}/build/staging

      - name: Build pipewire
        if: steps.cache-pipewire.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git clone --branch 1.4.7 --depth 1 https://gitlab.freedesktop.org/pipewire/pipewire.git
          meson setup build/pipewire pipewire \
            --prefix=${{ github.workspace }}/build/staging
          meson compile -C build/pipewire
          meson install -C build/pipewire

      - name: Cache tensorflow
        id: cache-tensorflow
        uses: actions/cache@v4
        with:
          key: tensorflow
          path: |
            ${{ github.workspace }}/build/staging

      - name: Build tensorflow
        if: steps.cache-tensorflow.outputs.cache-hit != 'true'
        working-directory: ${{github.workspace}}
        run: |
          STAGING_PREFIX="${{ github.workspace }}/build/staging"
          mkdir -p "${STAGING_PREFIX}"
          
          # Clone directly into staging
          git clone https://github.com/tensorflow/tensorflow.git "${STAGING_PREFIX}/tensorflow"
          cd "${STAGING_PREFIX}/tensorflow"
          git checkout v2.19.0
          
          wget https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
          chmod +x ./bazelisk-linux-amd64
          
          export CC=/usr/bin/clang-18
          export CXX=/usr/bin/clang++-18
          export CC_OPT_FLAGS="-march=native"
          export USE_DEFAULT_PYTHON_LIB_PATH=1
          export TF_NEED_JEMALLOC=1
          export TF_NEED_OPENCL_SYCL=0
          export TF_NEED_CUDA=0
          export TF_DOWNLOAD_CLANG=0
          export TF_SET_ANDROID_WORKSPACE=0
          ./configure
          
          # Clean bazel cache to avoid using cached toolchain with wrong compiler
          ./bazelisk-linux-amd64 clean --expunge
          
          ./bazelisk-linux-amd64 build //tensorflow/lite:libtensorflowlite.so \
            -c opt \
            --repo_env=CC=/usr/bin/clang-18 \
            --repo_env=CXX=/usr/bin/clang++-18 \
            --action_env=CC=/usr/bin/clang-18 \
            --action_env=CXX=/usr/bin/clang++-18 \
            --repo_env=BAZEL_COMPILER=/usr/bin/clang-18

          mkdir -p "${STAGING_PREFIX}/lib"          
          cp bazel-bin/tensorflow/lite/libtensorflowlite.so "${STAGING_PREFIX}/lib/"
